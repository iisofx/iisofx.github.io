<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تم تأكيد الإيميل — MFA Match Analyzer</title>
<style>
  /* nothing loaded from anywhere, no scripts: the link's tokens in the address are never read or kept */
  :root { --page:#0c0912; --card:#17111f; --ink:#ece7e3; --muted:#a79fb3; --gold:#ebad1d; --line:#2a2133; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--page); color:var(--ink); font:17px/1.6 "Segoe UI", Tahoma, Arial, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--gold); border-radius:16px;
          padding:36px 28px; max-width:440px; width:100%; text-align:center; }
  .tick { width:64px; height:64px; border-radius:50%; background:rgba(94,224,122,.14); color:#5ee07a; font-size:36px;
          line-height:64px; margin:0 auto 14px; }
  h1 { margin:0 0 6px; font-size:1.5rem; }
  p { margin:4px 0; color:var(--muted); }
  .en { direction:ltr; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .brand { margin-top:18px; color:var(--gold); font-weight:700; letter-spacing:.5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>تم تأكيد الإيميل</h1>
    <p>ارجع للبرنامج وسجّل دخولك.</p>
    <div class="en">
      <h1>Email confirmed</h1>
      <p>Go back to the app and sign in.</p>
    </div>
    <div class="brand">MFA Match Analyzer</div>
  </div>
</body>
</html>
